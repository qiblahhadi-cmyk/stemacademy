name: STEM Academy quality checks

on:
  push:
    branches:
      - build/frontend-foundation
  pull_request:
    branches:
      - main
      - build/frontend-foundation

permissions:
  contents: read

jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run code and frontend checks
        run: npm run check
