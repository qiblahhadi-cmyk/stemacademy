<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb">
<meta name="description" content="Take an assessment"><title>Assessment | STEM Academy</title>
<link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/modules.css">
</head>
<body>
<main class="main-area" style="margin:0 auto;max-width:760px;padding:24px">
<header class="topbar"><div class="breadcrumb"><a href="/index.html">Dashboard</a> <span>/</span> <strong>Assessment</strong></div><div class="topbar-right"><span class="role-label">Signing in…</span><button class="secondary-button" type="button" data-sign-out>Sign out</button></div></header>
<section class="page-content">
<p class="form-feedback" id="pageNotice" data-auth-notice role="status" aria-live="polite"></p>
<section class="panel" id="assessmentPanel">
<p class="eyebrow">ASSESSMENT</p>
<h1 id="assessmentTitle">Loading…</h1>
<p class="muted" id="assessmentMeta"></p>
<div id="assessmentInstructions" class="detail-content"></div>
<p id="attemptSummary" class="muted" aria-live="polite"></p>
<div class="dialog-actions"><button class="primary-button" type="button" id="startButton" hidden>Start assessment</button></div>
<p id="timer" class="muted" aria-live="polite" hidden></p>
<form id="attemptForm" hidden>
<div id="questionList"></div>
<div class="dialog-actions"><button class="primary-button" type="submit" id="submitButton">Submit answers</button></div>
<p class="form-feedback" id="attemptFeedback" role="status" aria-live="polite"></p>
</form>
</section>
</section>
</main>
<script src="/assets/js/bundles/session.js" defer></script>
<script src="/assets/js/take-assessment.js" defer></script>
</body>
</html>
